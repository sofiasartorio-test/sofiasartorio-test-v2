name: TEST auto-update

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: test-auto-update
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrivi data e ora
        run: |
          STAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          mkdir -p static
          echo "Ultimo aggiornamento automatico: $STAMP" > static/last-update.txt

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/last-update.txt
          git commit -m "test: auto update"
          git push

      - name: Avvia il deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main